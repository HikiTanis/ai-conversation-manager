name: Bug report
description: Report a reproducible problem using synthetic or fully redacted data.
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real backups, JSONL sessions, Codex databases, source files, prompts, usernames, paths, or secrets.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: Version shown in the app
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Selected provider
      options:
        - Codex
        - DSH (DeepSeek Harness)
        - Both / switching
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows, desktop client, and Node.js versions (for DSH)
      placeholder: Windows 11 24H2; Codex ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backup
        - Import or restore
        - Conversation viewing
        - Archive filters or DSH archive actions
        - Project or path reassociation
        - Trash, deletion, or sidebar repair
        - Language or UI
        - Build or packaging
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use invented paths and synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted error text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed real conversation content, project data, usernames, absolute private paths, IDs, and secrets.
          required: true
