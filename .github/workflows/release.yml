name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js for DSH tests
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate release tag and version
        id: version
        shell: powershell
        run: |
          $version = [IO.File]::ReadAllText('VERSION').Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION v$version."
          }
          $releaseNotes = "docs\releases\v$version.md"
          if (-not (Test-Path -LiteralPath $releaseNotes)) {
            throw "Missing release notes: $releaseNotes"
          }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version$([Environment]::NewLine)", [Text.UTF8Encoding]::new($false))
          .\scripts\Verify-Release.ps1 -Version $version

      - name: Build, test, and package
        shell: powershell
        # GitHub-hosted Windows runners do not expose the interactive desktop
        # required by the HWND hit-test and WPF screenshot regressions.
        run: .\scripts\package.ps1 -Version '${{ steps.version.outputs.version }}' -SkipUiTests

      - name: Create or update GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = $env:GITHUB_REF_NAME
          $zip = Resolve-Path "release\CodexConversationManager-Windows-v$version.zip"
          $sums = Resolve-Path 'release\SHA256SUMS.txt'
          $notes = Resolve-Path "docs\releases\v$version.md"
          $title = "Codex Conversation Manager $tag"

          $releaseListJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseExists = @($releaseListJson | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag }).Count -gt 0

          if ($releaseExists) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file $notes.Path --title $title
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag $zip.Path $sums.Path --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
            gh release create $tag $zip.Path $sums.Path --repo $env:GITHUB_REPOSITORY --verify-tag --notes-file $notes.Path --title $title
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
