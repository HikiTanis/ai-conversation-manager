name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Set up Rust
        shell: powershell
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate stable tag
        shell: powershell
        run: |
          $version = [IO.File]::ReadAllText('VERSION').Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag does not match VERSION.' }
          .\scripts\Verify-Release.ps1 -Version $version
      - name: Build, test and package
        shell: powershell
        run: .\scripts\package.ps1 -SkipUiTests
      - name: Publish stable release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [IO.File]::ReadAllText('VERSION').Trim()
          $tag = "v$version"
          $base = "release/v$version/AI-Conversation-Manager-$version-Windows-x64"
          $assets = @("$base-Setup.exe", "$base-Portable.zip", "release/v$version/SHA256SUMS.txt", "release/v$version/update.json")
          $notes = "docs/releases/v$version.md"
          $title = "AI Conversation Manager v$version"
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($releases | Where-Object tagName -eq $tag).Count -gt 0) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file $notes --title $title --draft=false --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --verify-tag --notes-file $notes --title $title --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
