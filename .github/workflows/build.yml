name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Set up Rust
        shell: powershell
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, test and verify stable packages
        shell: powershell
        run: .\scripts\package.ps1 -SkipUiTests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: artifacts/test/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: AI-Conversation-Manager-Windows-x64
          path: |
            release/v*/*-Setup.exe
            release/v*/*-Portable.zip
            release/v*/SHA256SUMS.txt
          if-no-files-found: error
