[package]
name = "conversation-manager-desktop"
version = "2.1.0"
description = "AI Conversation Manager for Codex and DeepSeek Harness"
authors = ["HikiTanis"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", features = ["blocking", "json"] }
sha2 = "0.10"
semver = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
